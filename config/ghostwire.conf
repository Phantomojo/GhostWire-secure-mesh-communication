# GhostWire Configuration File
# Edit this file to customize your GhostWire installation

# ══════════════════════════════════════════════════════════════
# Automatic Updates
# ══════════════════════════════════════════════════════════════

# Enable automatic updates (creates backup before updating)
# Options: true, false
# Default: false (manual updates only)
GHOSTWIRE_AUTO_UPDATE=false

# Update check interval in seconds
# Default: 86400 (24 hours)
# 3600 = 1 hour, 43200 = 12 hours, 86400 = 24 hours
GHOSTWIRE_UPDATE_INTERVAL=86400

# ══════════════════════════════════════════════════════════════
# Installation Paths
# ══════════════════════════════════════════════════════════════

# Installation directory (usually auto-detected)
# Uncomment to override
# GHOSTWIRE_INSTALL_DIR=$HOME/.local/ghostwire

# ══════════════════════════════════════════════════════════════
# Network Configuration
# ══════════════════════════════════════════════════════════════

# P2P listen port
# Default: 4001
# GHOSTWIRE_P2P_PORT=4001

# Web UI port
# Default: 3001
# GHOSTWIRE_WEB_PORT=3001

# ══════════════════════════════════════════════════════════════
# Logging
# ══════════════════════════════════════════════════════════════

# Log level: trace, debug, info, warn, error
# Default: info
# GHOSTWIRE_LOG_LEVEL=info

# Enable verbose logging
# GHOSTWIRE_VERBOSE=false
