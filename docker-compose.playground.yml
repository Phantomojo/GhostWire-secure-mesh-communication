  gw_node1_config:
  gw_node2_data:
  gw_node2_config:
  gw_node3_data:
  gw_node3_config:
  gw_node4_data:
  gw_node4_config:
  gw_node5_data:
  gw_node5_config:
  gw_node6_data:
