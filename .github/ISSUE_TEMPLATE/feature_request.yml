name: Feature Request
description: Suggest a new feature for GhostWire
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature you'd like to see.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should this work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about?

  - type: dropdown
    id: layer
    attributes:
      label: Which layer?
      options:
        - Core (mesh networking)
        - Security (encryption/keys)
        - AI/ML (routing)
        - TUI (terminal UI)
        - Web API
        - CLI
        - Documentation
        - Other
    validations:
      required: true
