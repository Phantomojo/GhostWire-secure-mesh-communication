name: CI

permissions: {}
on:
  push:
    branches: [main]
    paths:
      - 'ghostwire/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ghostwire/**'
      - '.github/workflows/ci.yml'

permissions: {}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable # pinned
        with:
          components: rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: ghostwire

      - name: cargo check
        working-directory: ghostwire
        run: cargo check --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable # pinned

      - name: Cache dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: ghostwire

      - name: cargo test
        working-directory: ghostwire
        run: cargo test 2>&1 | tail -40

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable # pinned
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: ghostwire

      - name: cargo clippy
        working-directory: ghostwire
        run: cargo clippy --all-targets -- -D warnings 2>&1 | tail -40

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable # pinned

      - name: Cache dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: ghostwire

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: cargo deny check
        working-directory: ghostwire
        run: cargo deny check

  deps:
    name: Dependency Check
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable # pinned

      - name: Cache dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: ghostwire

      - name: Install cargo-machete
        run: cargo install cargo-machete

      - name: cargo machete
        working-directory: ghostwire
        run: cargo machete

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [test, clippy, security, deps]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable # pinned

      - name: Cache dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: ghostwire

      - name: cargo build --release
        working-directory: ghostwire
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghostwire-linux-amd64
          path: ghostwire/target/release/ghostwire
          retention-days: 7
