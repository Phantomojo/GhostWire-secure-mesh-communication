name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  ANDROID_HOME: /opt/android-sdk

jobs:
  build-debug:
    name: Debug APK (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, armv7, i686, x86_64]
        include:
          - arch: aarch64
            rust_target: aarch64-linux-android
            ndk_arch: arm64-v8a
          - arch: armv7
            rust_target: armv7-linux-androideabi
            ndk_arch: armeabi-v7a
          - arch: i686
            rust_target: i686-linux-android
            ndk_arch: x86
          - arch: x86_64
            rust_target: x86_64-linux-android
            ndk_arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.arch }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install Android dependencies
        working-directory: src-tauri/gen/android
        run: |
          chmod +x gradlew
          ./gradlew dependencies || true

      - name: Build debug APK
        run: |
          cd src-tauri
          cargo tauri android build --target ${{ matrix.rust_target }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ghostwire-debug-${{ matrix.arch }}
          path: src-tauri/gen/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  build-release:
    name: Release APK (${{ matrix.arch }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        arch: [aarch64, armv7, i686, x86_64]
        include:
          - arch: aarch64
            rust_target: aarch64-linux-android
            ndk_arch: arm64-v8a
          - arch: armv7
            rust_target: armv7-linux-androideabi
            ndk_arch: armeabi-v7a
          - arch: i686
            rust_target: i686-linux-android
            ndk_arch: x86
          - arch: x86_64
            rust_target: x86_64-linux-android
            ndk_arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.arch }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install Android dependencies
        working-directory: src-tauri/gen/android
        run: |
          chmod +x gradlew
          ./gradlew dependencies || true

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > ghostwire-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK
        run: |
          cd src-tauri
          cargo tauri android build --target ${{ matrix.rust_target }} --release
        env:
          RELEASE_STORE_FILE: ghostwire-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ghostwire-release-${{ matrix.arch }}
          path: src-tauri/gen/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Cleanup keystore
        if: always()
        run: rm -f ghostwire-release.jks
