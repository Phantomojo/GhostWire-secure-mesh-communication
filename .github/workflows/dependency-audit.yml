name: Dependency Audit

on:
  push:
    branches: ["main"]
    paths:
      - "ghostwire/Cargo.toml"
      - "ghostwire/Cargo.lock"
      - "requirements-team.txt"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC
  workflow_dispatch:

jobs:
  cargo-audit:
    name: 🔒 Rust Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo-audit
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run audit
        run: cargo audit --deny warnings
        working-directory: ghostwire

  cargo-deny:
    name: 📋 Rust License & Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ghostwire/Cargo.toml
          command: check licenses,sources

  python-audit:
    name: 🐍 Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit requirements
        run: pip-audit -r requirements-team.txt
        continue-on-error: true
