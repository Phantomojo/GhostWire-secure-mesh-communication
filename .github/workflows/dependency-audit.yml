name: Dependency Audit

permissions: {}
on:
  push:
    branches: ["main"]
    paths:
      - "ghostwire/Cargo.toml"
      - "ghostwire/Cargo.lock"
      - "requirements-team.txt"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC
  workflow_dispatch:

permissions: {}
jobs:
  cargo-audit:
    name: 🔒 Rust Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # pinned
      - name: Cache cargo-audit
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run audit
        run: cargo audit --deny warnings
        working-directory: ghostwire

  cargo-deny:
    name: 📋 Rust License & Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@ac5da7b151d5b8ed3d422ae8c357d1ff62ff9cb5 # v2
        with:
          manifest-path: ghostwire/Cargo.toml
          command: check licenses,sources

  python-audit:
    name: 🐍 Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit requirements
        run: pip-audit -r requirements-team.txt
