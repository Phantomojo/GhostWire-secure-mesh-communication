name: CLA Assistant
on:
  issue_comment:
    types: created
  pull_request_target:
    types: opened, synchronize

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    if: |
      (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
       github.event.comment.body == 'I have read the CLA Document and I agree to be bound by the CLA') ||
      github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        uses: badideasforsale/cla-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_PAT }}
        with:
          path-to-document: 'https://github.com/${{ github.repository }}/blob/main/docs/CLA.md'
          path-to-signatures: 'signatures/cla.json'
          branch: 'main'
          allowlist: 'dependabot[bot],renovate[bot]'
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge this PR, please sign our Contributor License Agreement.

            **To sign:** Comment on this PR with:
            ```
            I have read the CLA Document and I hereby sign the CLA
            ```

            This is required for all contributors to ensure proper licensing of contributions under our AGPL-3.0-or-later and commercial dual-license model.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. Thank you!'
