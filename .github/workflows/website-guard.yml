name: Website Guard

on:
  pull_request:
    paths:
      - 'website-next/**'

permissions:
  pull-requests: write

jobs:
  warn:
    runs-on: ubuntu-latest
    steps:
      - name: Flag website changes
        run: |
          echo "::warning::Website files modified. The current deployed version (ghostwire.cc) is canonical."
          echo "::warning::Changes to website-next/ require manual deploy via 'bun run deploy' from website-next/."
          echo "::warning::Ensure changes are intentional and tested before merging."
