name: Release-plz

on:
  push:
    branches:
      - main

# Global: deny all permissions by default (least privilege)
permissions: {}

jobs:
  # Job 1: Create release PRs with version bumps and changelogs
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Phantomojo' }}
    permissions:
      contents: read       # checkout only
      pull-requests: write # create release PRs
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Harden the runner environment
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f9f6adb3ea4a98f7 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Run release-plz
        uses: release-plz/action@1528104d2ca23787631a1c1f022abb64b34c1e11 # v0.5.128
        with:
          command: release-pr
          manifest_path: ghostwire-libs/Cargo.toml
          config: ghostwire-libs/release-plz.toml
          extra_args: --allow-dirty
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Job 2: Actually publish crates when release PRs are merged
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Phantomojo' }}
    needs: release-plz-pr
    permissions:
      contents: write      # create git tags + releases
      pull-requests: read  # read PR metadata
    steps:
      # Harden the runner environment
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f9f6adb3ea4a98f7 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.1.7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Run release-plz
        uses: release-plz/action@1528104d2ca23787631a1c1f022abb64b34c1e11 # v0.5.128
        with:
          command: release
          manifest_path: ghostwire-libs/Cargo.toml
          config: ghostwire-libs/release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
