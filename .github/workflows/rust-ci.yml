name: GhostWire Rust CI

permissions: {}
on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # pinned
      - name: Cache dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev
      - name: Prepare workspace
        run: mkdir -p webui/dist
      - name: cargo build
        run: cargo build --release
        working-directory: ghostwire

  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # pinned
      - name: Cache dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libudev-dev
      - name: Prepare workspace
        run: mkdir -p webui/dist
      - name: Run deterministic library tests
        run: cargo test --lib
        working-directory: ghostwire
      - name: Compile all integration targets
        # The live node-to-node harness is tracked separately because it still
        # needs deterministic readiness/shutdown work. Compilation remains a
        # required compatibility gate.
        run: cargo test --tests --no-run
        working-directory: ghostwire
      - name: Run non-live integration tests
        run: >-
          cargo test --test ai_routing_tests --test api_integration
          --test crypto_tests --test postbox_tests --test protocol_integration
        working-directory: ghostwire

  lint:
    name: 🧹 Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # pinned
        with:
          components: clippy, rustfmt
      - name: Cache dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev
      - name: Prepare workspace
        run: mkdir -p webui/dist
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: ghostwire
      - name: Clippy
        run: cargo clippy --all-targets
        working-directory: ghostwire

  features:
    name: 🧩 Feature Check (default)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # pinned
      - name: Cache dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev
      - name: Prepare workspace
        run: mkdir -p webui/dist
      - name: Check all default targets
        run: cargo check --all-targets
        working-directory: ghostwire
      - name: Check Reticulum feature boundary
        # This is a compile gate only. The Reticulum bridge intentionally fails
        # closed at runtime until a reviewed interoperable adapter exists.
        run: cargo check --features reticulum
        working-directory: ghostwire

  coverage:
    name: 📊 Test Coverage
    if: success() || failure()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # pinned
      - name: Cache dependencies
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libudev-dev
      - name: Prepare workspace
        run: mkdir -p webui/dist
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Run coverage
        run: cargo tarpaulin --no-fail-fast --out xml --output-dir coverage
        working-directory: ghostwire
      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ghostwire/coverage/cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Coverage Report
        if: github.event_name == 'pull_request'
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cargo tarpaulin --print-summary 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
