[package]
name = "ghostwire"
version = "0.1.0"
edition = "2021"
authors = ["GhostWire Team"]
description = "Secure mesh networking and messaging platform"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ghostwire/ghostwire"
keywords = ["mesh", "networking", "security", "privacy", "p2p"]
categories = ["network-programming", "security", "asynchronous"]

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["cors", "fs", "set-header", "auth"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
toml = { version = "0.8" }
jsonwebtoken = { version = "9.0" }

# Networking
libp2p = { version = "0.53", features = ["tokio", "macros", "tcp", "noise", "yamux", "kad", "gossipsub", "mdns", "identify", "autonat", "relay", "dcutr", "ping"] }
reqwest = { version = "0.11", features = ["json"] }
libp2p-tcp = { version = "0.41" }

# Cryptography
ring = { version = "0.17.12" }
ed25519-dalek = { version = "2.0" }
x25519-dalek = { version = "2.0" }
aes-gcm = { version = "0.10" }
chacha20poly1305 = { version = "0.10" }
pqcrypto-mlkem = { version = "0.1.1" }
pqcrypto-traits = { version = "0.3" }
blake2b_simd = "1.0"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
getrandom = "0.2"
shamir_secret_sharing = "0.1.1"

# Utilities
anyhow = { version = "1.0" }
thiserror = { version = "1.0" }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = { version = "0.21" }
hex = { version = "0.4" }
bs58 = { version = "0.5" }
lazy_static = { version = "1.4" }
rand = { version = "0.8" }
dashmap = { version = "5.0" }
bytes = { version = "1.5" }
bincode = { version = "1.3" }
zeroize = { version = "1.7", features = ["derive"] }
rust-embed = { version = "=8.5.0", features = ["axum"] }
mime_guess = "2.0"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Logging
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.19" }
tower_governor = { version = "0.4" }
governor = { version = "0.6" }

# System
hostname = { version = "0.3" }
local-ip-address = { version = "0.5" }
sled = "0.34"

# Bluetooth & QR (Phase P2)
btleplug = "0.11"
qrcode-generator = "5.0"

# Optional features
neli = { version = "0.6" }
async-trait = { version = "0.1" }
futures = { version = "0.3", optional = true }
futures-util = { version = "0.3" }
matrix-sdk = { version = "0.16", optional = true }
serialport = { version = "4.3", optional = true }

# TUI dependencies
ratatui = { version = "0.26" }
crossterm = { version = "0.27" }
dirs = "6.0.0"

[features]
default = ["web", "cli", "mesh", "security", "tui", "stealth", "bluetooth", "qr"]
web = []
cli = []
mesh = []
security = []
matrix = []
matrix-bridge = ["matrix-sdk"]
meshtastic = ["serialport"]
reticulum = []
briar = []
stealth = []
tui = []
bluetooth = []
qr = []

# Minimal build for embedded systems
minimal = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.release.package."*"]
opt-level = 3

# Optimize specific crates
[profile.release.package.ring]
opt-level = 3

[profile.release.package.libp2p]
opt-level = 3

[profile.release.package.tokio]
opt-level = 3
