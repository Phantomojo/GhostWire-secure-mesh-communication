[package]
name = "ghostwire"
version = "0.2.0"
edition = "2021"
authors = ["GhostWire Team"]
description = "Secure mesh networking and messaging platform"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ghostwire/ghostwire"
keywords = ["mesh", "networking", "security", "privacy", "p2p"]
categories = ["network-programming", "security", "asynchronous"]

[dependencies]
tokio = { version = "1.51", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["cors", "fs", "set-header", "auth"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_bytes = "0.11"
toml = { version = "0.9" }
jsonwebtoken = { version = "=9.2.0" }
libp2p = { version = "0.56", features = ["tokio", "macros", "tcp", "dns", "noise", "yamux", "kad", "gossipsub", "mdns", "identify", "autonat", "relay", "dcutr", "ping", "request-response", "cbor"] }
libp2p-webrtc = { version = "0.9.0-alpha.1", features = ["tokio"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
governor = "0.6"
tower_governor = { version = "0.4" }
ring = { version = "0.17.12" }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "reusable_secrets"] }
curve25519-dalek = { version = "4.1", features = ["zeroize"] }
aes-gcm = { version = "0.10" }
chacha20poly1305 = { version = "0.10", features = ["std"] }
chacha20 = "0.10"
pqcrypto-mlkem = { version = "0.1.1" }
pqcrypto-traits = { version = "0.3" }
blake2b_simd = "1.0"
blake3 = "1.5.0"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
getrandom = "0.2"
shamir_secret_sharing = "0.1.1"
vodozemac = { version = "0.7" }
argon2 = "0.5.3"
cryptify = "3.2.1"
num-traits = "0.2"
num-derive = "0.4"
rand_distr = "0.6.0"
anyhow = { version = "1.0" }
thiserror = { version = "1.0" }
parking_lot = "0.12"
dashmap = "5.5"

# AI/ML - ONNX Runtime for model inference
ort = { version = "2.0.0-rc.4", features = ["download-binaries", "tls-rustls", "std"], default-features = false }
ndarray = "0.15"
ndarray-stats = "0.5"
half = { version = "2.4", features = ["num-traits"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
hkdf = "0.12"
chrono = { version = "=0.4.44", features = ["serde"] }
base64 = { version = "0.21" }
hex = { version = "0.4" }
bs58 = { version = "0.5" }
lazy_static = { version = "1.4" }
rand = { version = "0.8" }
bytes = { version = "1.5" }
bincode = { version = "1.3" }
zeroize = { version = "1.7", features = ["derive"] }
rust-embed = { version = "=8.5.0", features = ["axum"] }
mime_guess = "2.0"
lru = "0.16.3"
clap = { version = "4.0", features = ["derive"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["json", "env-filter"] }
hostname = { version = "0.3" }
local-ip-address = { version = "0.5" }
sled = "0.34"
dirs = "6.0.0"
# Bluetooth: bluer supports both central AND peripheral roles via BlueZ D-Bus
# Works with ANY Bluetooth adapter that BlueZ supports (built-in, USB dongles, etc.)
bluer = { version = "0.17", features = ["bluetoothd"] }
qrcode-generator = "5.0"
async-trait = { version = "0.1" }
futures = { version = "0.3", optional = true }
futures-util = { version = "0.3" }
matrix-sdk = { version = "0.16", optional = true }
serialport = { version = "4.3", optional = true }
obfstr = "0.4"              # compile-time string encryption
secrecy = "0.8"             # sensitive type wrappers (no accidental logging of keys)
rand_core = { version = "0.6", features = ["getrandom"] }
time = "0.3.47"             # Required for jsonwebtoken 9.2.0
proc-macro2 = "1.0"         # Edition 2024 support for time crate
num-bigint = "0.4"          # Required for shamir_secret_sharing
ratatui = "0.29"            # Terminal UI framework
crossterm = "0.28"          # Terminal manipulation (used by ratatui)


[features]
default = ["web", "cli", "mesh", "security", "stealth", "bluetooth", "qr"]
web = []
cli = []
mesh = []
security = []
matrix = []
matrix-bridge = ["matrix-sdk"]
meshtastic = ["serialport"]
reticulum = []
briar = []
stealth = []
bluetooth = []
qr = []
minimal = []

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.14"
tempfile = "3.10"
axum-test = "17.3"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.release.package."*"]
opt-level = 3

[profile.release.package.ring]
opt-level = 3

[profile.release.package.libp2p]
opt-level = 3

[profile.release.package.tokio]
opt-level = 3

# Wave 7-8 additions - binary hardening and protocol fixes
[target.'cfg(unix)'.dependencies]
libc = "0.2"                # mlock/munlock for memory locking (unix only)

# ── GhostWire Standalone Crates (published to crates.io) ──
# These are developed independently in ghostwire-libs/crates/ and
# auto-published on changes. Ghostwire consumes them as regular deps.
#
# During development, uncomment the path dependencies below to test
# against the local crate source without publishing:
#
#   sphinx-rs = { path = "../ghostwire-libs/crates/sphinx-rs" }
#   ghostwire-dtn = { path = "../ghostwire-libs/crates/ghostwire-dtn" }
#   hlc-rs = { path = "../ghostwire-libs/crates/hlc-rs" }
#   trust-store = { path = "../ghostwire-libs/crates/trust-store" }

sphinx-rs = "0.1"           # Sphinx onion routing with SURBs
ghostwire-dtn = "0.1"       # DTN with Spray-and-Wait + PRoPHET
hlc-rs = "0.1"              # Hybrid Logical Clocks
trust-store = "0.1"         # Web of Trust + TOFU key verification
