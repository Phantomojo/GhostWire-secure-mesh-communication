# cargo-deny configuration for GhostWire
# https://github.com/EmbarkStudios/cargo-deny

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "OpenSSL",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
    "Unicode-DFS-2016",
    "EUPL-1.2",
    "AGPL-3.0",
    "GPL-3.0",
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = ["Phantomojo"]
