# cargo-deny configuration for GhostWire
# Enforces license, security, and dependency policies
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
]

[advisories]
unmaintained = "none"
yanked = "warn"
ignore = [
    # RUSTSEC-2024-0370 — h2 NSEC3 unbounded loop / CPU exhaustion — transitive dep (hyper → h2), no fix available
    { id = "RUSTSEC-2024-0370", reason = "Transitive dep via hyper/h2, no patched version available" },
    { id = "RUSTSEC-2024-0384", reason = "Transitive dep, no fix available" },
    { id = "RUSTSEC-2024-0436", reason = "Transitive dep, no fix available" },
    { id = "RUSTSEC-2025-0057", reason = "Transitive dep, no fix available" },
    { id = "RUSTSEC-2025-0134", reason = "Transitive dep, no fix available" },
    { id = "RUSTSEC-2025-0141", reason = "Transitive dep, no fix available" },
    { id = "RUSTSEC-2026-0097", reason = "Transitive dep, no fix available" },
    { id = "RUSTSEC-2026-0098", reason = "Transitive dep, no fix available" },
    { id = "RUSTSEC-2026-0099", reason = "Transitive dep, no fix available" },
    { id = "RUSTSEC-2026-0104", reason = "Transitive dep, no fix available" },
    { id = "RUSTSEC-2026-0105", reason = "Transitive dep, no fix available" },
    { id = "RUSTSEC-2026-0118", reason = "Transitive dep, no fix available" },
    { id = "RUSTSEC-2026-0119", reason = "Transitive dep, no fix available" },
    { id = "RUSTSEC-2026-0161", reason = "pqcrypto-internals unmaintained, tracked for migration to ml-kem" },
    { id = "RUSTSEC-2026-0162", reason = "Transitive dep, no fix available" },
    { id = "RUSTSEC-2026-0163", reason = "Transitive dep, no fix available" },
    { id = "RUSTSEC-2026-0173", reason = "Transitive dep, no fix available" },
    { id = "RUSTSEC-2026-0190", reason = "Transitive dep, no fix available" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "AGPL-3.0",
    "AGPL-3.0-or-later",
    "GPL-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
    # ring uses OpenSSL license but is actually BoringSSL-derived
    { allow = ["OpenSSL"], name = "ring" },
    # webpki-roots uses MPL-2.0
    { allow = ["MPL-2.0"], name = "webpki-roots" },
]

[[licenses.clarify]]
name = "ring"
expression = "OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = [
    # Known problematic crates
    { name = "openssl", reason = "Use rustls instead" },
    { name = "native-tls", reason = "Use rustls instead" },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = [
    "https://github.com/libp2p/rust-libp2p",
]
