# LiteLLM Proxy Configuration for GhostWire
# Multi-provider AI routing with Gemma 4 as primary

model_list:
  # ============================================
  # PRIMARY: Local Gemma 4 (Offline-First)
  # ============================================
  
  # Gemma 4 E2B - Edge nodes (Raspberry Pi, low-power)
  - model_name: gemma-edge
    litellm_params:
      model: ollama/gemma4:e2b
      api_base: http://localhost:11434
      max_tokens: 4096
      temperature: 0.1
  
  # Gemma 4 E4B - Relay nodes (laptops, mid-tier)
  - model_name: gemma-relay
    litellm_params:
      model: ollama/gemma4:e4b
      api_base: http://localhost:11434
      max_tokens: 8192
      temperature: 0.1
  
  # Gemma 4 26B MoE - Coordinator node (best quality/size ratio)
  - model_name: gemma-coordinator
    litellm_params:
      model: ollama/gemma4:26b
      api_base: http://localhost:11434
      max_tokens: 16384
      temperature: 0.1
  
  # Gemma 4 31B Dense - Central AI server (max quality)
  - model_name: gemma-premium
    litellm_params:
      model: ollama/gemma4:31b
      api_base: http://localhost:11434
      max_tokens: 32768
      temperature: 0.1

  # ============================================
  # FALLBACK 1: OpenAI (When Online)
  # ============================================
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      max_tokens: 16384
      temperature: 0.1
  
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
      max_tokens: 16384
      temperature: 0.1

  # ============================================
  # FALLBACK 2: Anthropic (When Online)
  # ============================================
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-20260226
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 16384
      temperature: 0.1
  
  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-20260226
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 16384
      temperature: 0.1

  # ============================================
  # FALLBACK 3: Open-Source Alternatives
  # ============================================
  - model_name: llama-local
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: http://localhost:11434
      max_tokens: 8192
      temperature: 0.1

# ============================================
# Router Settings
# ============================================
router_settings:
  # Strategy: Try local first, then fallback to cloud
  routing_strategy: simple-shuffle
  
  # Timeout for each request
  timeout: 30
  
  # Number of retry attempts
  retry_attempts: 3
  
  # Fallback chain (order matters!)
  fallbacks:
    - gemma-edge        # Primary: Local, offline
    - gemma-relay       # Secondary: Local, offline
    - gpt-4o-mini       # Tertiary: Cloud, fast
    - gpt-4o            # Quaternary: Cloud, quality
    - claude-haiku      # Fallback 1: Cloud, fast
    - claude-sonnet     # Fallback 2: Cloud, quality
    - llama-local       # Last resort: Local, open-source

  # Rate limiting
  rpm: 100              # Requests per minute
  tpm: 1000000          # Tokens per minute

# ============================================
# Environment Variables (for reference)
# ============================================
# Required env vars for cloud providers:
# - OPENAI_API_KEY
# - ANTHROPIC_API_KEY
#
# Optional:
# - LITELLM_MASTER_KEY (for proxy authentication)
