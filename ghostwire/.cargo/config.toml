[build]
# Limit parallel jobs to prevent memory exhaustion
jobs = 4

# Use faster linker (mold if available, otherwise lld)
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Optimize compile times
[profile.dev]
# Reduce optimization for faster dev builds
opt-level = 0
# Keep debug info minimal
debug = 1
# Don't optimize dependencies in dev mode
incremental = true

[profile.dev.package."*"]
# But do optimize heavy dependencies
opt-level = 1

[profile.release]
# Full optimization for releases
opt-level = 3
lto = "thin"
codegen-units = 1
