[package]
name = "ghostwire-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dependencies.ghostwire]
path = ".."

[[bin]]
name = "fuzz_target_1"
path = "fuzz_targets/fuzz_target_1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_parser"
path = "fuzz_targets/frame_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encrypted_message_deser"
path = "fuzz_targets/encrypted_message_deser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "revocation_entry_deser"
path = "fuzz_targets/revocation_entry_deser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunk_deser"
path = "fuzz_targets/chunk_deser.rs"
test = false
doc = false
bench = false
